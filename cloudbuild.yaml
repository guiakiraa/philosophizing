steps:
  # Build da imagem Docker
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/aporia/aporia:$COMMIT_SHA"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/aporia/aporia:latest"
      - "."

  # Push para o Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/aporia/aporia"

  # Deploy no Cloud Run (privado — acionado via Cloud Scheduler com OIDC)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "aporia"
      - "--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/aporia/aporia:$COMMIT_SHA"
      - "--region=southamerica-east1"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GMAIL_USER=GMAIL_USER:latest,GMAIL_APP_PASSWORD=GMAIL_APP_PASSWORD:latest,TO_EMAIL=TO_EMAIL:latest"

images:
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/aporia/aporia"

options:
  logging: CLOUD_LOGGING_ONLY
